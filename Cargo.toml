[package]
name = "agtx"
version = "0.1.0"
edition = "2021"
description = "A lightweight, read-only terminal observer for agent-driven changes"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Dava-M/agtx"
keywords = ["git", "tui", "diff", "terminal", "watcher"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
notify = "8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
